services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend (BharatVault RAG Engine + Pinecone + OpenRouter)
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bharatvault-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount corpus, cached embeddings, and persistent index files
      - ./data:/app/data
      - ./.cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # -------------------------------------------------------------
  # 2. React SPA Frontend (Elsewhere-Styled UI + Nginx Reverse Proxy)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bharatvault-frontend
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      backend:
        condition: service_healthy
