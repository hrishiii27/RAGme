[project]
name = "ragme"
version = "0.1.0"
description = "RAG over Indian government public documents — a phase-by-phase learning & benchmarking project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # data
    "pyarrow>=15",
    "pandas>=2.2",
    "huggingface_hub>=0.24",
    "langdetect>=1.0.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    # chunking / tokens
    "tiktoken>=0.7",
    # embeddings + vector store
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    # LLMs
    "google-genai>=1.0",
    "openai>=1.40",          # OpenRouter is OpenAI-API compatible
    # backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "langchain-text-splitters>=1.1.3",
    "diskcache>=5.6.3",
    "httpx>=0.28.1",
    "sse-starlette>=3.5.0",
    "pinecone>=10.0.0",
]

[project.optional-dependencies]
eval = ["ragas>=0.2", "langfuse>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rag", "backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
